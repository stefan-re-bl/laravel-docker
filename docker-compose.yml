services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/var/www/html:Z
    ports:
      - "8000:80"
    depends_on:
      - db
    # user: "${USER_ID}:${GROUP_ID}"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
    - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
